  trained_model_path: artifacts/training/model.pth

model_evaluation:
  root_dir: artifacts/evaluation
  metric_file_name: artifacts/evaluation/scores.json

evaluation:
  root_dir: artifacts/evaluation
  model_path: artifacts/training/model.pth
  metric_file_name: artifacts/evaluation/metrics.json